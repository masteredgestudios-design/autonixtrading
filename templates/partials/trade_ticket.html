<aside class="bot-panel" id="trade-panel">
  <div class="bot-panel-inner">

    <!-- Header -->
    <div class="bot-header">
      <div class="bot-header-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <circle cx="12" cy="16" r="1"/>
        </svg>
      </div>
      <span class="bot-header-label">Bot Control Panel</span>
      <div class="bot-status-dot" id="bot-status-dot"></div>
    </div>

    <!-- Trade Selection (dynamic) -->
    <div class="bot-field-group" id="bot-selection-group">
      <label class="bot-label">Selection</label>
      <div class="bot-segmented" id="bot-selection-segmented">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Digit picker (Over/Under, Match/Differ only) -->
    <div class="bot-field-group" id="bot-digit-group" style="display:none">
      <label class="bot-label">Digit</label>
      <div class="bot-digit-row" id="bot-digit-row">
        <button class="bot-digit-btn" data-digit="0">0</button>
        <button class="bot-digit-btn active" data-digit="1">1</button>
        <button class="bot-digit-btn" data-digit="2">2</button>
        <button class="bot-digit-btn" data-digit="3">3</button>
        <button class="bot-digit-btn" data-digit="4">4</button>
        <button class="bot-digit-btn" data-digit="5">5</button>
        <button class="bot-digit-btn" data-digit="6">6</button>
        <button class="bot-digit-btn" data-digit="7">7</button>
        <button class="bot-digit-btn" data-digit="8">8</button>
        <button class="bot-digit-btn" data-digit="9">9</button>
      </div>
    </div>

    <!-- Inputs grid -->
    <div class="bot-inputs-grid">
      <div class="bot-field-group">
        <label class="bot-label">Stake (USD)</label>
        <div class="bot-input-wrap">
          <input type="number" class="bot-input" id="bot-stake" value="10" min="0.35" max="50000" step="0.5" />
        </div>
      </div>
      <div class="bot-field-group">
        <label class="bot-label">Duration (ticks)</label>
        <div class="bot-input-wrap">
          <input type="number" class="bot-input" id="bot-duration" value="1" min="1" max="10" step="1" />
        </div>
      </div>
      <div class="bot-field-group">
        <label class="bot-label">Take Profit ($)</label>
        <div class="bot-input-wrap">
          <input type="number" class="bot-input" id="bot-tp" value="5" min="0.1" step="0.1" />
        </div>
      </div>
      <div class="bot-field-group">
        <label class="bot-label">Stop Loss ($)</label>
        <div class="bot-input-wrap">
          <input type="number" class="bot-input" id="bot-sl" value="20" min="0.1" step="0.1" />
        </div>
      </div>
      <div class="bot-field-group bot-field-full">
        <label class="bot-label">Martingale Multiplier</label>
        <div class="bot-input-wrap">
          <input type="number" class="bot-input" id="bot-martingale" value="2.2" min="1" max="10" step="0.1" />
        </div>
      </div>
    </div>

    <!-- Live session stats -->
    <div class="bot-session-stats" id="bot-session-stats">
      <div class="bot-stat">
        <span class="bot-stat-label">Session P&amp;L</span>
        <span class="bot-stat-value" id="bot-session-pl">$0.00</span>
      </div>
      <div class="bot-stat">
        <span class="bot-stat-label">Trades</span>
        <span class="bot-stat-value" id="bot-session-trades">0</span>
      </div>
      <div class="bot-stat">
        <span class="bot-stat-label">Win Rate</span>
        <span class="bot-stat-value" id="bot-session-wr">—</span>
      </div>
      <div class="bot-stat">
        <span class="bot-stat-label">Streak</span>
        <span class="bot-stat-value" id="bot-session-streak">—</span>
      </div>
    </div>

    <!-- Start / Stop button -->
    <button class="bot-start-btn" id="bot-start-btn">
      <svg class="btn-icon-start" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <svg class="btn-icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="6" y="6" width="12" height="12" rx="1"/>
      </svg>
      <span id="bot-start-label">START BOT</span>
    </button>

    <!-- Reset button -->
    <button class="bot-reset-btn" id="bot-reset-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
      <span>RESET BOT</span>
    </button>

    <!-- Last trade result -->
    <div class="bot-last-trade" id="bot-last-trade" style="display:none">
      <span class="bot-last-label">Last trade</span>
      <span class="bot-last-result" id="bot-last-result"></span>
    </div>

  </div>
</aside>
