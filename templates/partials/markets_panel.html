<div class="markets-panel" id="markets-panel" aria-hidden="true">
  <div class="markets-panel-inner">
    <div class="markets-panel-header">
      <h2 class="markets-panel-title">Markets</h2>
      <div class="markets-search-wrap">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="search"
          class="markets-search"
          id="markets-search"
          placeholder="Search markets..."
          autocomplete="off"
        />
      </div>
      <button
        class="markets-close-btn"
        id="markets-close-btn"
        aria-label="Close markets panel"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <div class="markets-tabs" role="tablist">
      <button
        class="markets-tab"
        role="tab"
        data-tab="favorites"
        aria-selected="false"
      >
        Favorites
      </button>
      <button
        class="markets-tab active"
        role="tab"
        data-tab="derived"
        aria-selected="true"
      >
        Derived
      </button>
      <button
        class="markets-tab"
        role="tab"
        data-tab="stock_indices"
        aria-selected="false"
      >
        Stock Indices
      </button>
      <button
        class="markets-tab"
        role="tab"
        data-tab="cryptocurrencies"
        aria-selected="false"
      >
        Cryptocurrencies
      </button>
      <button
        class="markets-tab"
        role="tab"
        data-tab="forex"
        aria-selected="false"
      >
        Forex
      </button>
      <button
        class="markets-tab"
        role="tab"
        data-tab="commodities"
        aria-selected="false"
      >
        Commodities
      </button>
    </div>

    <div class="markets-content" id="markets-content">
      <!-- Populated by JS -->
      <div class="markets-loading">Loading markets...</div>
    </div>
  </div>
</div>
<div class="markets-overlay" id="markets-overlay"></div>
