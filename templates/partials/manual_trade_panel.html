<aside class="bot-panel manual-panel" id="manual-panel">
  <div class="bot-panel-inner">
    <div class="trading-mode-switcher" role="group" aria-label="Trading mode">
      <span class="trading-mode-label">Trading Mode</span>
      <div class="trading-mode-buttons">
        <button class="trading-mode-btn active" type="button" data-trading-mode="manual">Manual Trading</button>
        <button class="trading-mode-btn" type="button" data-trading-mode="bot">Bot Control</button>
      </div>
    </div>
    <div class="bot-header">
      <div class="bot-header-icon">&#8596;</div>
      <span class="bot-header-label">Manual Trading</span>
      <div class="bot-status-dot"></div>
    </div>
    <div class="bot-field-group" id="manual-digit-group">
      <label class="bot-label">Digit</label>
      <div class="bot-digit-row" id="manual-digit-row">
        {% for digit in range(10) %}<button class="bot-digit-btn{% if digit == 1 %} active{% endif %}" type="button" data-digit="{{ digit }}">{{ digit }}</button>{% endfor %}
      </div>
    </div>
    <div class="bot-inputs-grid">
      <div class="bot-field-group"><label class="bot-label" for="manual-stake">Stake (USD)</label><div class="bot-input-wrap"><input type="number" class="bot-input" id="manual-stake" value="10" min="0.35" max="50000" step="0.5"></div></div>
      <div class="bot-field-group"><label class="bot-label" for="manual-duration">Duration (ticks)</label><div class="bot-input-wrap"><input type="number" class="bot-input" id="manual-duration" value="1" min="1" max="10" step="1"></div></div>
    </div>
    <div class="manual-trade-result" id="manual-trade-result" aria-live="polite" style="display:none">
      <span class="bot-stat-label">Achieved Profit</span>
      <span class="bot-stat-value pending" id="manual-achieved-profit">Pending...</span>
    </div>
    <div class="manual-action-grid" id="manual-action-grid"></div>
    <div class="bot-last-trade" id="manual-last-trade" style="display:none"><span class="bot-last-label">Last trade</span><span class="bot-last-result" id="manual-last-result"></span></div>
  </div>
</aside>
