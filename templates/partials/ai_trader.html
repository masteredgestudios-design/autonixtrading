<section class="bulk-trader-section ai-trader-section" id="ai-trader-section">
  <div class="bulk-header">
    <div class="bulk-header-left">
      <div class="bulk-header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20" />
          <path d="M17 5H9" />
          <path d="M19 9H7" />
          <path d="M15 13H9" />
          <path d="M18 17H6" />
        </svg>
      </div>
      <div>
        <div class="bulk-eyebrow">AI Trader</div>
        <h2 class="bulk-title">AI Trader</h2>
        <p class="bulk-subtitle">A professional-grade autonomous trader that manages the entire session, adapts stake size, evaluates recovery, and stops when the configured targets are reached.</p>
      </div>
    </div>
    <span class="bulk-status-pill bulk-status-idle" id="ai-status-pill">Ready</span>
  </div>

  <div class="bulk-config-grid">
    <label class="bot-input-field">
      <span class="bot-input-label">Symbol</span>
      <select id="ai-symbol" class="bulk-input">
        <option value="1HZ10V">Volatility 10 (1s)</option>
        <option value="1HZ25V" selected>Volatility 25 (1s)</option>
        <option value="1HZ50V">Volatility 50 (1s)</option>
        <option value="1HZ75V">Volatility 75 (1s)</option>
        <option value="1HZ100V">Volatility 100 (1s)</option>
        <option value="R_10">Volatility 10</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_100">Volatility 100</option>
      </select>
    </label>
    <label class="bot-input-field">
      <span class="bot-input-label">Strategy</span>
      <select id="ai-strategy" class="bulk-input">
        <option value="risk-recovery">Risk &amp; Recovery</option>
        <option value="stake-stop-loss" selected>Stake &amp; Stop on Loss</option>
      </select>
    </label>
    <label class="bot-input-field" id="ai-risk-field" style="display:none">
      <span class="bot-input-label">Risk Amount (USD)</span>
      <input type="number" id="ai-risk-amount" class="bulk-input" value="20" min="10" step="1" />
    </label>
    <label class="bot-input-field" id="ai-stake-field">
      <span class="bot-input-label">Stake (USD)</span>
      <input type="number" id="ai-stake-amount" class="bulk-input" value="10" min="0.35" step="0.01" />
    </label>
    <label class="bot-input-field">
      <span class="bot-input-label">Take Profit (USD)</span>
      <input type="number" id="ai-take-profit" class="bulk-input" value="5" min="5" step="1" />
    </label>
  </div>

  <div class="bulk-actions-row">
    <button class="bulk-execute-btn" id="ai-start-btn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Start AI
    </button>
    <button class="bulk-stop-btn" id="ai-stop-btn" type="button" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      </svg>
      Stop AI
    </button>
    <button class="bulk-stop-btn" id="ai-reset-btn" type="button" style="background: rgba(91,157,255,.16); color: #5b9dff;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"></path>
        <path d="M21 3v6h-6"></path>
      </svg>
      Reset Session
    </button>
  </div>

  <div class="ai-summary-card" id="ai-summary"></div>
  <div class="ai-stats-card" id="ai-stats"></div>
  <div class="ai-analysis-card" id="ai-analysis-summary"></div>

  <div class="ai-log-card">
    <div class="ai-log-header">
      <span class="ai-log-title">AI Activity Log</span>
      <span class="ai-log-status" id="ai-status-text">Idle</span>
    </div>
    <ul class="ai-log-list" id="ai-log-list"></ul>
  </div>
</section>
