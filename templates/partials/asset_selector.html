<div class="asset-selector-bar">
  <button
    class="asset-selector-btn"
    id="asset-selector-btn"
    aria-haspopup="true"
    aria-expanded="false"
  >
    <div class="asset-icon">
      <span class="asset-badge">100</span>
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="3" y="3" width="4" height="12" rx="1" />
        <rect x="10" y="7" width="4" height="8" rx="1" />
        <rect x="17" y="1" width="4" height="14" rx="1" />
      </svg>
    </div>
    <div class="asset-info">
      <span class="asset-name" id="selected-asset-name"
        >Volatility 100 (1s) Index</span
      >
      <span class="asset-symbol" id="selected-asset-symbol">1HZ100V</span>
    </div>
    <svg
      class="asset-chevron"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  <div class="chart-price-display">
    <span class="current-price" id="current-price">—</span>
    <span class="price-change" id="price-change"></span>
  </div>
</div>
